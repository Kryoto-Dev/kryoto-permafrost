[workspace]
resolver = "2"
members = ["crates/kryo", "crates/cli", "crates/setup", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Kryoto-Dev/kryoto-permafrost"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
